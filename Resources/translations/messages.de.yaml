kanka_mail.error.placeholder: Unbekannter oder fehlerhafter Platzhalter. Bitte nur die dokumentierten Platzhalter verwenden.
kanka_mail.error.missing_value: Ein Platzhalter verweist auf leere Kunden- oder Rechnungsdaten. Bitte Angaben ergänzen oder Vorlage anpassen.
kanka_mail.error.language: Für die Kundensprache fehlt eine vollständige Vorlage. Bitte in den Rechnungs-E-Mail-Einstellungen ergänzen.
kanka_mail.error.customer: Der Rechnung ist kein Kunde zugeordnet.
kanka_mail.error.attachment: Die gespeicherte Rechnungs-PDF ist nicht verfügbar. Es wird keine neue Rechnung automatisch erzeugt.
kanka_mail.error.sender: In Kimai ist keine gültige Absenderadresse eingerichtet.
kanka_mail.error.changed: Die angehängte Rechnung wurde seit der Vorbereitung geändert. Bitte E-Mail erneut vorbereiten und prüfen.
kanka_mail.error.fields: Empfänger, Betreff und Nachricht prüfen. Zeilenumbrüche im Header und überlange Angaben sind nicht erlaubt.
kanka_mail.error.recipient: Eine gültige Rechnungs-E-Mail-Adresse eintragen. Die allgemeine Kunden-E-Mail wird nicht automatisch verwendet.
kanka_mail.error.disabled: Direktversand ist deaktiviert. In den Plugin-Einstellungen aktivieren oder die E-Mail zum manuellen Versand herunterladen.
kanka_mail.error.test_recipient: Die Testumgebung erlaubt ausschließlich ihre festgelegten Testempfänger.
kanka_mail.error.busy: Ein weiterer Versandversuch läuft. Bitte dessen Ergebnis vor einem erneuten Versuch prüfen.
kanka_mail.error.duplicate: Für diese Rechnung liegt bereits ein Versandversuch vor. Doppelte Übermittlungen und unklare Wiederholungen werden blockiert. Bitte vorheriges Ergebnis prüfen.
kanka_mail.error.transport: Versand fehlgeschlagen oder unklar. Vor erneutem Versand beim Mailanbieter prüfen. Es wurde nicht automatisch erneut gesendet.
kanka_mail.error.expired: Diese Vorschau ist abgelaufen oder wurde ersetzt. Bitte E-Mail erneut vorbereiten und prüfen.

kanka_mail.saved: Alle Einstellungen wurden gespeichert.
kanka_mail.placeholder_copy: "Nur den fett dargestellten Code links kopieren, einschließlich beider geschweifter Klammern. Die Erklärung rechts gehört nicht zum Platzhalter. Alle Platzhalter funktionieren in Betreff, Anrede und Nachricht."
kanka_mail.placeholder_token: "Platzhalter zum Kopieren"
kanka_mail.placeholder_meaning: "Bedeutung"
kanka_mail.customer.help: "Einzelne Felder leer lassen, um die Vorlage der Kundensprache zu verwenden. Diese Felder betreffen nur die E-Mail, nicht die Rechnungs-PDF. Fehlende Angaben, auf die ein Platzhalter verweist, müssen vor der Vorbereitung ergänzt werden."
kanka_mail.placeholder.customer_name: "Das Feld Name des Kunden in Kimai."
kanka_mail.placeholder.company: "Das Feld Firma; wenn es leer ist, wird der Kundenname verwendet."
kanka_mail.placeholder.contact: "Das vollständige Feld Contact beziehungsweise Kontakt. Der Name wird nicht aufgeteilt."
kanka_mail.placeholder.invoice_number: "Die Nummer der ausgewählten, gespeicherten Rechnung."
kanka_mail.placeholder.invoice_date: "Rechnungsdatum im Format JJJJ-MM-TT."
kanka_mail.placeholder.due_date: "Fälligkeitsdatum im Format JJJJ-MM-TT."
kanka_mail.placeholder.total: "Rechnungsbetrag einschließlich Währung, formatiert in der Kundensprache."
kanka_mail.placeholder.currency: "Währungskürzel, zum Beispiel EUR oder USD."
kanka_mail.mark_pending: "Neue Rechnungen nach angenommenem Direktversand auf Pending setzen"
kanka_mail.mark_pending_help: "Standardmäßig aktiviert. Bezahlte, stornierte und bereits offene Rechnungen bleiben unverändert. Erfordert das Recht zum Bearbeiten der Rechnung. EML-Downloads ändern den Status nicht."
kanka_mail.sent: "Der SMTP-Server hat die Nachricht angenommen. Das bestätigt noch keine Zustellung. Der Rechnungsstatus wurde beibehalten."
kanka_mail.sent_pending: "Der SMTP-Server hat die Nachricht angenommen. Die Rechnung steht jetzt auf Pending. Das bestätigt noch keine Zustellung im Posteingang."
kanka_mail.sent_status_permission: "Nachricht angenommen, aber die Berechtigung zur Statusänderung fehlt. Eine berechtigte Person kann die Rechnung in der Historie auf Pending setzen. Deswegen nicht erneut senden."
kanka_mail.sent_status_failed: "Nachricht angenommen, aber Pending konnte nicht gespeichert werden. Status in der Rechnungshistorie prüfen und dort ändern. Deswegen nicht erneut senden."
kanka_mail.status.failed: "Nicht angenommen – Ursache beheben und neu vorbereiten"
kanka_mail.status.retryable: "Ausgang durch Administrator geprüft und neuer Versuch freigegeben"
kanka_mail.error.smtp_auth: "Die SMTP-Anmeldung wurde abgelehnt. Konto, Passwort beziehungsweise App-Passwort und Berechtigungen beim Anbieter prüfen. Es wurde keine Nachricht übertragen. Nach der Korrektur neu vorbereiten und prüfen."
kanka_mail.error.smtp_connect: "SMTP-Verbindung, TLS oder anfängliche Anmeldung fehlgeschlagen. Server, Port, Verschlüsselung, Zertifikat und Anbietereinstellungen prüfen. Es wurde keine Nachricht übertragen. Nach der Korrektur neu vorbereiten."
kanka_mail.error.smtp_capacity: "Der SMTP-Server hat die Nachricht wegen eines Größen- oder Kapazitätslimits abgelehnt. Anhanggröße, Postfachspeicher und Anbieterlimits prüfen. Nach der Korrektur neu vorbereiten."
kanka_mail.error.smtp_temporary: "Der SMTP-Server hat die Nachricht vorübergehend abgelehnt, etwa wegen eines Versandlimits oder einer Störung. Warten oder beim Anbieter prüfen, dann neu vorbereiten. Es erfolgt kein automatischer Neuversand."
kanka_mail.error.smtp_rejected: "Der SMTP-Server hat die Nachricht abgelehnt. Empfänger, Absender, Kontoberechtigungen und Anbieterrichtlinien prüfen. Nach der Korrektur neu vorbereiten und prüfen."
kanka_mail.error.smtp_uncertain: "Verbindung oder Transport sind nach Beginn des Versands fehlgeschlagen. Die Nachricht kann bereits angenommen worden sein. Gesendete Nachrichten oder Anbieterprotokolle prüfen; vor Wiederholung muss ein Administrator den Versuch klären."
kanka_mail.error.unsupported_transport: "Direktversand erfordert einen einzelnen SMTP-Transport in Kimai. Warteschlangen, Failover-, API- und Null-Transporte werden dafür nicht unterstützt. Mailkonfiguration durch einen Administrator prüfen lassen oder EML herunterladen."
kanka_mail.error.storage: "Der Versandnachweis konnte nicht sicher gespeichert werden. Freien Speicher und Rechte im Kimai-Datenverzeichnis prüfen. Vor einem neuen Versuch den bisherigen Ausgang prüfen; kein automatischer Neuversand."
kanka_mail.error.receipt: "Der Versandnachweis kann nicht sicher gelesen werden. Versand gesperrt. Ein Administrator muss Datenverzeichnis oder gültiges Backup prüfen. Den Nachweis nicht einfach löschen."
kanka_mail.error.accepted_storage: "Der SMTP-Server hat diese Nachricht angenommen, aber der endgültige Versandnachweis konnte nicht gespeichert werden. Nicht erneut senden. Speicherproblem beheben und über Versand prüfen/freigeben die Annahme bestätigen."
kanka_mail.error.stale_receipt: "Dieser Versuch wurde inzwischen geändert oder benötigt keine Freigabe mehr. Eine neue Rechnungsvorschau öffnen und den aktuellen Ausgang prüfen."
kanka_mail.recovery: "Versand prüfen/freigeben"
kanka_mail.recovery_help: "Der Versandausgang ist unklar. Ein Administrator mit Berechtigung für Systemeinstellungen muss vor einer Wiederholung beim Anbieter prüfen. Rechnungsstatus und EML-Download beweisen keinen Versand."
kanka_mail.recovery_instructions: "Gesendete Nachrichten oder Anbieterprotokolle für Rechnung, Empfänger und Zeitpunkt prüfen. Die Prüfung dokumentieren. Annahme nur mit Beleg bestätigen; einen neuen Versuch erst nach Prüfung des Doppelversandrisikos freigeben. Diese Aktion versendet selbst keine E-Mail."
kanka_mail.recovery_decision: "Geprüftes Ergebnis"
kanka_mail.choose: "Ergebnis auswählen"
kanka_mail.confirm_accepted: "Ich habe die Annahme dieser Nachricht durch den Anbieter bestätigt"
kanka_mail.confirm_retry: "Ich habe den Ausgang geprüft und gebe einen neuen Versuch frei"
kanka_mail.recovery_reason: "Was wurde geprüft? Keine Passwörter oder Nachrichteninhalte eintragen."
kanka_mail.recovery_save: "Entscheidung speichern"
kanka_mail.recovery_done: "Die Entscheidung wurde gespeichert. Vor dem Senden eine neue E-Mail vorbereiten und prüfen. Diese Aktion hat nichts versendet."
kanka_mail.maintenance: "Versandnachweise bereinigen"
kanka_mail.retention_days: "Persönliche Details abgeschlossener Nachweise nach dieser Anzahl Tage entfernen"
kanka_mail.compact: "Alte persönliche Details entfernen"
kanka_mail.retention_help: "Pro Rechnung bleiben ein kleiner Nachweis und eine Sperrdatei erhalten, ohne E-Mail-Text oder PDF-Kopie. Diese Funktion entfernt Empfänger, Benutzer und Notizen aus alten angenommenen oder fehlgeschlagenen Versuchen. Minimale Ergebnismerker und Sperrdateien bleiben als Doppelversandschutz erhalten. Unklare oder freigegebene Versuche sowie Rechnungen bleiben unverändert. Pro Durchlauf werden höchstens 1.000 Nachweise bereinigt; bei Bedarf wiederholen. Für Backups gilt eine eigene Aufbewahrung."
kanka_mail.retention_done: "Persönliche Details aus %count% alten Nachweisen entfernt. Der Doppelversandschutz bleibt erhalten."
