kanka_mail.settings_intro: Hier die E-Mail-Standards einstellen. PDF-Inhalt und Billing Information bleiben unverändert. Direktversand ist zunächst deaktiviert.
kanka_mail.languages_help: Die verfügbaren Sprachen ergeben sich aus den Spracheinstellungen Ihrer Kunden. Ändern Sie dort die Sprache, um eine weitere Vorlage einzurichten. Ungenutzte gespeicherte Vorlagen bleiben erhalten.
