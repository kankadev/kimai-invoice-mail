kanka_mail.error.missing_value: A placeholder refers to empty customer or invoice data. Complete the data or adjust the template.
kanka_mail.error.language: No complete template exists for the customer's language. Configure it in Invoice Mail settings.
kanka_mail.error.customer: The invoice has no customer.
kanka_mail.error.attachment: The stored PDF invoice is unavailable. No new invoice will be generated automatically.
kanka_mail.error.sender: Kimai has no valid sender address configured.
kanka_mail.error.changed: The attached invoice changed after preparation. Prepare and review the email again.
kanka_mail.error.fields: Check the recipient, subject and message. Header line breaks and oversized values are not allowed.
kanka_mail.error.recipient: Enter one valid invoice email address. No automatic fallback to the general customer email is used.
kanka_mail.error.disabled: Direct sending is disabled. Enable it in Invoice Mail settings or download the email for manual sending.
kanka_mail.error.test_recipient: The test environment permits only its configured test recipients.
kanka_mail.error.busy: Another delivery attempt is running. Check its result before trying again.
kanka_mail.error.duplicate: This invoice already has a delivery attempt. Repeated submissions and uncertain retries are blocked. Check the previous result.
kanka_mail.error.transport: Delivery failed or is uncertain. Check the mail provider before retrying; the message has not been resent automatically.
kanka_mail.error.expired: This preview expired or was replaced. Prepare and review the email again.

kanka_mail.saved: All settings were saved.
kanka_mail.placeholder_copy: "Copy only the bold code in the left column, including both braces. The right column explains its meaning and is not part of the placeholder. All placeholders work in subject, greeting and message."
kanka_mail.placeholder_token: "Placeholder to copy"
kanka_mail.placeholder_meaning: "Meaning"
kanka_mail.customer.help: "Leave any override empty to use the customer’s language template. These fields affect the email only, not the invoice PDF. A referenced empty value must be completed before preparing the email."
kanka_mail.placeholder.customer_name: "The customer’s Name field in Kimai."
kanka_mail.placeholder.company: "The Company field; uses the customer’s Name if Company is empty."
kanka_mail.placeholder.contact: "The complete Contact field. The name is not split into first and last names."
kanka_mail.placeholder.invoice_number: "The number of the selected, saved invoice."
kanka_mail.placeholder.invoice_date: "Invoice date in YYYY-MM-DD format."
kanka_mail.placeholder.due_date: "Payment due date in YYYY-MM-DD format."
kanka_mail.placeholder.total: "Invoice total, including currency, formatted in the customer’s language."
kanka_mail.placeholder.currency: "Currency code, for example EUR or USD."
kanka_mail.mark_pending: "Set new invoices to Pending after accepted direct sending"
kanka_mail.mark_pending_help: "Enabled by default. Paid, canceled and already pending invoices are preserved. Requires permission to edit the invoice. EML downloads do not change status."
kanka_mail.sent: "The SMTP server accepted the message. This does not prove delivery to the recipient. Invoice status was preserved."
kanka_mail.sent_pending: "The SMTP server accepted the message. The invoice is now Pending. This does not prove inbox delivery."
kanka_mail.sent_status_permission: "Message accepted, but you lack permission to update the invoice. Ask an authorized user to set it to Pending in Invoice history. Do not resend for this reason."
kanka_mail.sent_status_failed: "Message accepted, but saving Pending failed. Check Invoice history and update the status there. Do not resend for this reason."
kanka_mail.status.failed: "Not accepted — correct the problem, then prepare a new attempt"
kanka_mail.status.retryable: "Administrator checked the outcome and allowed a new attempt"
kanka_mail.error.smtp_auth: "SMTP login was rejected. Check the configured account, password or app password and provider permissions. Nothing was submitted; after correction, prepare and review a new attempt."
kanka_mail.error.smtp_connect: "SMTP connection, TLS or initial login could not be established. Check the server, port, encryption, certificate and provider settings. No message was submitted; after correction, prepare a new attempt."
kanka_mail.error.smtp_capacity: "The SMTP server rejected the message because of a size or capacity limit. Check attachment size, mailbox quota and provider limits. After correction, prepare a new attempt."
kanka_mail.error.smtp_temporary: "The SMTP server temporarily rejected the message, for example because of rate limits or service availability. Wait or check with the provider, then prepare a new attempt. Nothing is retried automatically."
kanka_mail.error.smtp_rejected: "The SMTP server rejected the message. Check recipient and sender addresses, account permissions and provider policy. After correction, prepare and review a new attempt."
kanka_mail.error.smtp_uncertain: "The connection or transport failed after sending began. The server may already have accepted the message. Check sent messages or provider logs; an administrator must resolve this attempt before retrying."
kanka_mail.error.unsupported_transport: "Direct sending requires one SMTP transport in Kimai. Queues, failover, API and null transports are not supported for confirmed direct sending. Ask an administrator to review mail configuration, or download an EML."
kanka_mail.error.storage: "The delivery record could not be safely saved. Check free space and permissions on Kimai’s data directory. Check the previous attempt before retrying; no automatic resend occurs."
kanka_mail.error.receipt: "The delivery record cannot be read safely. Sending is blocked. Ask an administrator to check the data directory or restore a valid backup; do not simply delete the record."
kanka_mail.error.accepted_storage: "The SMTP server accepted this message, but the final delivery record could not be saved. Do not resend. Fix storage, then use Resolve delivery to confirm the accepted attempt."
kanka_mail.error.stale_receipt: "This attempt has changed or no longer needs recovery. Open a fresh invoice preview and check its current outcome."
kanka_mail.recovery: "Resolve delivery"
kanka_mail.recovery_help: "The delivery outcome is uncertain. An administrator with system settings permission must check the provider before allowing a repeat. The invoice status and EML downloads do not prove delivery."
kanka_mail.recovery_instructions: "Check the provider’s sent messages or logs for this invoice, recipient and time. Record what you checked. Confirm acceptance only with evidence; allow another attempt only after checking the duplicate risk. This action itself sends no email."
kanka_mail.recovery_decision: "Verified outcome"
kanka_mail.choose: "Choose an outcome"
kanka_mail.confirm_accepted: "I verified that the provider accepted this message"
kanka_mail.confirm_retry: "I checked the outcome and authorize a new attempt"
kanka_mail.recovery_reason: "What did you check? Do not enter passwords or message content."
kanka_mail.recovery_save: "Record decision"
kanka_mail.recovery_done: "The decision was recorded. Prepare and review a new email before sending. Nothing has been sent by this action."
kanka_mail.maintenance: "Delivery record maintenance"
kanka_mail.retention_days: "Remove personal details from final records older than this many days"
kanka_mail.compact: "Remove old personal details"
kanka_mail.retention_help: "One small record and lock are kept per invoice; no email body or PDF copy is stored here. This removes recipient, user and notes from old accepted or failed records. Minimal outcome markers and locks remain to prevent accidental duplicates. Uncertain or released attempts and invoices are untouched. Up to 1,000 records are compacted per run; repeat if needed. Backups have their own retention policy."
kanka_mail.retention_done: "Personal details removed from %count% old records. Duplicate protection remains."
